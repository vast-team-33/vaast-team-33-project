      <h1>Drive Loop: a self-training data engine for self-driving cars</h1>
      <p>
        Drive Loop finds pedestrians stepping into the road in dashcam video with NVIDIA models on VAST Data, scores how
        dangerous each moment is, compares what the driver did with what the model suggests, and turns every moment into
        training data. This is the archived demo; it needs JavaScript.
      </p>
