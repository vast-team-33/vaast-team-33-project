# Archived demo on GitHub Pages: the frontend in archive mode (VITE_ARCHIVE=1) plus the static
# snapshot in archive/ (built by scripts/build_archive.py). No backend; see README "Archived demo".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "archive/**"
      - "docs/crossing-risk-idea.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: openapi-typescript declares a peer of typescript 5, we use 6 (see frontend/README.md).
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run build:archive
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-archive

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
