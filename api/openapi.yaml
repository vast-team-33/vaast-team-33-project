openapi: 3.1.0
info:
  title: Crossing Risk API
  version: 0.1.0
  description: |
    Backend contract for the Crossing Risk frontend (team 33, VAST Builders Challenge London).
    Pedestrians in the ego car's path in dashcam footage, a danger score, what the driver did
    versus what the model suggests, human feedback, and scenario export to a simulator.

    **All paths are relative.** In production the app is served under `/app/` on the team host and
    the Ingress strips `/app`, so the frontend must call `api/...` relative to the page
    (never `/api/...`). Media URLs come back ready to use (`clip_url`, `thumb_url`).

    Example responses for every endpoint are in `api/fixtures/`.
servers:
  - url: ./
    description: Relative to wherever the app is served (production `/app/`, local dev via Vite proxy)
tags:
  - name: events
  - name: detectors
  - name: feedback
  - name: scenarios
  - name: meta

paths:
  /api/health:
    get:
      tags: [meta]
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {ok: {type: boolean}}, required: [ok]}

  /api/summary:
    get:
      tags: [meta]
      summary: Headline numbers for the dashboard
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Summary"}
              examples:
                real: {externalValue: "fixtures/summary.json"}

  /api/config:
    get:
      tags: [meta]
      summary: Lane polygon, score formula and allowed values, for drawing overlays and explaining the score
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Config"}

  /api/events:
    get:
      tags: [events]
      summary: List detected events
      parameters:
        - {name: min_danger, in: query, schema: {type: integer, minimum: 0, maximum: 100}}
        - {name: agreement, in: query, schema: {$ref: "#/components/schemas/Agreement"}}
        - {name: crossing, in: query, schema: {$ref: "#/components/schemas/CrossingLocation"}}
        - {name: position, in: query, schema: {$ref: "#/components/schemas/PedestrianPosition"}}
        - {name: drive, in: query, schema: {type: string, example: set04}}
        - {name: detector_id, in: query, schema: {type: string, example: crossing_risk}}
        - {name: has_feedback, in: query, schema: {type: boolean}}
        - name: sort
          in: query
          schema: {type: string, enum: [danger_desc, drive_time_asc], default: danger_desc}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: Page of events
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, items]
                properties:
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  items: {type: array, items: {$ref: "#/components/schemas/Event"}}

  /api/events/{id}:
    parameters: [{$ref: "#/components/parameters/EventId"}]
    get:
      tags: [events]
      summary: One event
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Event"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/events/{id}/detections:
    parameters: [{$ref: "#/components/parameters/EventId"}]
    get:
      tags: [events]
      summary: Per-frame boxes for drawing an overlay on the clip (10 per second)
      responses:
        "200":
          description: Detections
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Detections"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/events/{id}/feedback:
    parameters: [{$ref: "#/components/parameters/EventId"}]
    post:
      tags: [feedback]
      summary: Label who was right (driver or model). Feeds the self-improvement loop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: {$ref: "#/components/schemas/FeedbackChoice"}
                note: {type: string, maxLength: 500}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Feedback"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/feedback:
    get:
      tags: [feedback]
      summary: All feedback labels, newest first
      parameters:
        - {name: event_id, in: query, schema: {type: string}}
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Feedback"}}

  /api/events/{id}/scenario:
    parameters: [{$ref: "#/components/parameters/EventId"}]
    get:
      tags: [scenarios]
      summary: Simulator-ready scenario package for this event (real data)
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scenario"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/events/{id}/export:
    parameters: [{$ref: "#/components/parameters/EventId"}]
    post:
      tags: [scenarios]
      summary: Send the scenario to a simulator. DEMO STUB, no simulator is connected.
      description: "Always answers 202 with `demo: true`. The UI must say that sending is simulated."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: string, enum: [cosmos_transfer, omniverse, openscenario]}
      responses:
        "202":
          description: Accepted (simulated)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Export"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/detectors:
    get:
      tags: [detectors]
      summary: Built-in and user-created detectors
      responses:
        "200":
          description: Detectors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Detector"}}
    post:
      tags: [detectors]
      summary: Create a detector from a user-written prompt (status draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DetectorInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Detector"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/detectors/{detector_id}:
    parameters: [{$ref: "#/components/parameters/DetectorId"}]
    get:
      tags: [detectors]
      summary: One detector
      responses:
        "200":
          description: Detector
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Detector"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/detectors/{detector_id}/preview:
    parameters: [{$ref: "#/components/parameters/DetectorId"}]
    post:
      tags: [detectors]
      summary: Try the detector on ONE sample clip. Synchronous, about 5–7 s (one shared-GPU call).
      description: On success the detector's status becomes `tested`. Omit `event_id` to let the backend pick a sample.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id: {type: string, description: "Clip to test on; any event id"}
      responses:
        "200":
          description: Result on the sample
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreviewResult"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/detectors/{detector_id}/runs:
    parameters: [{$ref: "#/components/parameters/DetectorId"}]
    post:
      tags: [detectors]
      summary: Run the detector over the whole set (asynchronous). Poll the run.
      description: |
        The backend pre-filters clips with the stored YOLO boxes (`prefilter`), then asks the judge
        model about each candidate, at most 2 calls at a time on the shared GPU (about 3 s per clip
        overall). `max_clips` caps the cost; matches become events with this `detector_id`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                drives: {type: array, items: {type: string}, description: "Limit to drives, e.g. [set04]; default all"}
                max_clips: {type: integer, default: 50, maximum: 200}
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "A run of this detector is already in progress"}

  /api/runs/{run_id}:
    parameters:
      - {name: run_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [detectors]
      summary: Progress of a run (poll every 2–5 s)
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/detectors/{detector_id}/export:
    parameters: [{$ref: "#/components/parameters/DetectorId"}]
    post:
      tags: [scenarios]
      summary: Send every event of this detector to a simulator. DEMO STUB, like the per-event export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: string, enum: [cosmos_transfer, omniverse, openscenario]}
                min_danger: {type: integer}
      responses:
        "202":
          description: Accepted (simulated)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Export"}

  /media/clips/{id}.mp4:
    get:
      tags: [events]
      summary: The 5 s clip. Supports HTTP Range (seeking). Use the event's `clip_url`.
      parameters: [{$ref: "#/components/parameters/EventId"}]
      responses:
        "200": {description: video/mp4}
        "206": {description: Partial content}
        "404": {$ref: "#/components/responses/NotFound"}

  /media/thumbs/{id}.jpg:
    get:
      tags: [events]
      summary: Frame at the moment of closest approach, person boxed in red. Use the event's `thumb_url`.
      parameters: [{$ref: "#/components/parameters/EventId"}]
      responses:
        "200": {description: image/jpeg}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  parameters:
    DetectorId:
      name: detector_id
      in: path
      required: true
      schema: {type: string, example: det_0002}
    EventId:
      name: id
      in: path
      required: true
      description: Segment name, e.g. 20261001_065656_set04_video_chunk_0028_segment_005_of_006
      schema: {type: string}

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: not_found}
            message: {type: string}

    PedestrianPosition: {type: string, enum: [on_road, on_crosswalk, on_sidewalk_or_curb, none]}
    CrossingLocation: {type: string, enum: [marked_crosswalk, outside_crosswalk, not_crossing, unclear]}
    Risk: {type: string, enum: [none, low, medium, high]}
    ActualAction: {type: string, enum: [kept_speed, slowed_down, stopped, was_stopped, accelerated, unknown]}
    SuggestedAction: {type: string, enum: [stop, slow_down, proceed_with_caution, proceed, unknown]}
    Agreement: {type: string, enum: [driver_less_careful, driver_as_careful, driver_more_careful, unknown]}
    FeedbackChoice: {type: string, enum: [driver_right, model_right, both_fine, false_alarm]}
    Bbox:
      type: array
      description: "[x1, y1, x2, y2] in pixels of a frame_w × frame_h frame"
      items: {type: integer}
      minItems: 4
      maxItems: 4

    Event:
      type: object
      required: [id, detector_id, drive, chunk, segment, drive_time_sec, peak_sec, danger, factors, pedestrian_position,
                 crossing_location, risk, reason, actual_action, suggested_action, agreement, speeds,
                 suggested_speeds, person_bbox, frame_w, frame_h, frames_in_lane, clip_url, thumb_url, feedback]
      description: |
        For the built-in `crossing_risk` detector every field is filled. For user detectors the
        pedestrian-specific fields may be `none`/`unknown`/empty, and `reason` holds the judge's sentence.
      properties:
        id: {type: string}
        detector_id: {type: string, example: crossing_risk}
        drive: {type: string, description: "Drive name, set01 to set06", example: set04}
        chunk: {type: integer, description: "30 s chunk index within the drive"}
        segment: {type: integer, description: "5 s segment within the chunk, 1 to 6"}
        drive_time_sec: {type: number, description: "Start of this clip within the drive"}
        peak_sec: {type: number, description: "Moment of closest approach within the 5 s clip"}
        danger: {type: integer, minimum: 0, maximum: 100}
        factors:
          type: object
          description: The four inputs of the danger score (see /api/config)
          required: [closeness, exposure, location, moving]
          properties:
            closeness: {type: number, description: "0–1, person box height relative to half the frame"}
            exposure: {type: number, description: "0–1, share of the clip the person is in the lane"}
            location: {type: number, description: "weight for where the person is"}
            moving: {type: number, description: "weight for whether the car moves"}
        pedestrian_position: {$ref: "#/components/schemas/PedestrianPosition"}
        crossing_location: {$ref: "#/components/schemas/CrossingLocation"}
        risk: {$ref: "#/components/schemas/Risk"}
        reason: {type: string, description: "One sentence from the judge model"}
        actual_action: {$ref: "#/components/schemas/ActualAction"}
        suggested_action: {$ref: "#/components/schemas/SuggestedAction"}
        agreement: {$ref: "#/components/schemas/Agreement"}
        speeds:
          type: array
          items: {type: number}
          description: "Measured relative speed of the car every 0.2 s (optical flow, no unit)"
        suggested_speeds:
          type: array
          items: {type: number}
          description: "Same samples if the car had followed the model's suggestion"
        person_bbox: {$ref: "#/components/schemas/Bbox"}
        frame_w: {type: integer, example: 1920}
        frame_h: {type: integer, example: 1080}
        frames_in_lane: {type: integer, description: "Frames (30 fps) with the person in the lane"}
        clip_url: {type: string, example: "media/clips/<id>.mp4"}
        thumb_url: {type: string, example: "media/thumbs/<id>.jpg"}
        feedback:
          oneOf: [{$ref: "#/components/schemas/Feedback"}, {type: "null"}]
          description: The latest label, if any

    Feedback:
      type: object
      required: [id, event_id, choice, created_at]
      properties:
        id: {type: string}
        event_id: {type: string}
        choice: {$ref: "#/components/schemas/FeedbackChoice"}
        note: {type: string}
        created_at: {type: string, format: date-time}

    Detections:
      type: object
      required: [event_id, fps, frame_w, frame_h, lane_polygon, frames]
      properties:
        event_id: {type: string}
        fps: {type: integer, example: 10}
        frame_w: {type: integer}
        frame_h: {type: integer}
        lane_polygon: {type: array, items: {type: array, items: {type: integer}}, description: "Pixel corners of the lane zone"}
        frames:
          type: array
          items:
            type: object
            required: [t, boxes]
            properties:
              t: {type: number, description: "Seconds from the start of the clip"}
              boxes:
                type: array
                items:
                  type: object
                  required: [label, confidence, bbox, in_lane]
                  properties:
                    label: {type: string, example: person}
                    confidence: {type: number}
                    bbox: {$ref: "#/components/schemas/Bbox"}
                    in_lane: {type: boolean}

    Summary:
      type: object
      required: [generated_at, source, clips_scanned, candidates, events, by_agreement, by_crossing, by_risk, feedback_count, models]
      properties:
        generated_at: {type: string, format: date-time}
        source: {type: string}
        clips_scanned: {type: integer}
        candidates: {type: integer, description: "Clips with a person in the lane"}
        events: {type: integer, description: "Clips judged by the model"}
        by_agreement: {type: object, additionalProperties: {type: integer}}
        by_crossing: {type: object, additionalProperties: {type: integer}}
        by_risk: {type: object, additionalProperties: {type: integer}}
        feedback_count: {type: integer}
        models: {type: object, additionalProperties: {type: string}}

    Config:
      type: object
      required: [frame_w, frame_h, lane_polygon, speed_sample_sec, stop_threshold, score, feedback_choices]
      properties:
        frame_w: {type: integer}
        frame_h: {type: integer}
        lane_polygon: {type: array, items: {type: array, items: {type: integer}}}
        speed_sample_sec: {type: number}
        stop_threshold: {type: number}
        score:
          type: object
          properties:
            formula: {type: string}
            location_weights: {type: object, additionalProperties: {type: number}}
            moving_weights: {type: object, additionalProperties: {type: number}}
        feedback_choices: {type: array, items: {$ref: "#/components/schemas/FeedbackChoice"}}

    Scenario:
      type: object
      required: [scenario_id, source_event_id, format, summary, danger, ego, actors, environment, variations, generation_prompt, targets]
      properties:
        scenario_id: {type: string}
        source_event_id: {type: string}
        format: {type: string, example: crossing-risk-scenario/v0}
        summary: {type: string}
        danger: {type: integer}
        ego:
          type: object
          properties:
            actual_action: {$ref: "#/components/schemas/ActualAction"}
            suggested_action: {$ref: "#/components/schemas/SuggestedAction"}
            speed_sample_sec: {type: number}
            speed_profile_rel: {type: array, items: {type: number}}
            suggested_speed_profile_rel: {type: array, items: {type: number}}
        actors:
          type: array
          items:
            type: object
            properties:
              type: {type: string, example: pedestrian}
              position: {$ref: "#/components/schemas/PedestrianPosition"}
              crossing_location: {$ref: "#/components/schemas/CrossingLocation"}
              image_track:
                type: array
                items:
                  type: object
                  properties:
                    t: {type: number}
                    bbox: {$ref: "#/components/schemas/Bbox"}
        environment: {type: object, additionalProperties: {type: string}}
        variations: {type: array, items: {type: string}, description: "Suggested synthetic variations to generate"}
        generation_prompt: {type: string, description: "Text prompt for a video world model such as Cosmos Transfer"}
        targets:
          type: array
          items:
            type: object
            properties:
              id: {type: string, enum: [cosmos_transfer, omniverse, openscenario]}
              label: {type: string}

    DetectorInput:
      type: object
      required: [name, prompt]
      properties:
        name: {type: string, maxLength: 80, example: Cyclist close to the car}
        prompt: {type: string, maxLength: 800, description: "What to look for, in plain words"}
        description: {type: string, maxLength: 300}
        prefilter:
          type: object
          description: Cheap filter on the stored YOLO boxes before the judge model runs
          properties:
            object_class: {type: string, description: "COCO class, e.g. person, bicycle, car, truck, bus"}
            in_lane: {type: boolean, description: "Require the object inside the lane zone"}

    Detector:
      allOf:
        - {$ref: "#/components/schemas/DetectorInput"}
        - type: object
          required: [id, kind, status, created_at, event_count]
          properties:
            id: {type: string}
            kind: {type: string, enum: [builtin, user]}
            status: {type: string, enum: [draft, tested, running, active, failed]}
            created_at: {type: string, format: date-time}
            last_run_id: {type: [string, "null"]}
            event_count: {type: integer}

    PreviewResult:
      type: object
      required: [detector_id, sample_event_id, result, latency_ms, model]
      properties:
        detector_id: {type: string}
        sample_event_id: {type: string}
        result:
          type: object
          required: [match, confidence, reason]
          properties:
            match: {type: boolean}
            confidence: {type: number, minimum: 0, maximum: 1}
            moment_sec: {type: [number, "null"]}
            reason: {type: string}
        latency_ms: {type: integer}
        model: {type: string}

    Run:
      type: object
      required: [run_id, detector_id, status, progress, matched, started_at]
      properties:
        run_id: {type: string}
        detector_id: {type: string}
        status: {type: string, enum: [queued, running, completed, failed]}
        progress:
          type: object
          required: [done, total]
          properties:
            done: {type: integer}
            total: {type: integer}
        matched: {type: integer}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        estimated_seconds: {type: integer}
        error: {type: string}

    Export:
      type: object
      required: [export_id, event_id, target, status, demo, message, created_at]
      properties:
        export_id: {type: string}
        event_id: {type: string}
        target: {type: string}
        status: {type: string, enum: [queued]}
        demo: {type: boolean, description: "Always true for now: nothing is actually sent"}
        message: {type: string}
        created_at: {type: string, format: date-time}
